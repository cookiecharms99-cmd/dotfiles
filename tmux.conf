# Better terminal colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Start numbering windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Easier splits, preserving current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes without the prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Mouse support: select panes, resize, scroll
set -g mouse on

# More scrollback
set -g history-limit 10000

# Reload config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Minimal dark status bar
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#a6e3a1,bold] 🍪 #S "
set -g status-right "#[fg=#89b4fa]%H:%M "
set -g window-status-current-format "#[fg=#f9e2af,bold] #I:#W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#a6e3a1"
